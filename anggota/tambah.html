<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIMPUS-Mini | Tambah Anggota</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/style.css" />
</head>

<body>
  <header class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-semibold" href="../index.html">SIMPUS-Mini</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu"
                aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <nav class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="../index.html">Beranda</a></li>
                    <li class="nav-item"><a class="nav-link" href="../buku/list.html">Daftar Buku</a></li>
                    <li class="nav-item"><a class="nav-link" href="../buku/tambah.html">Tambah Buku</a></li>
                    <li class="nav-item"><a class="nav-link" href="list.html">Daftar Anggota</a></li>
                    <li class="nav-item"><a class="nav-link active" href="tambah.html">Tambah Anggota</a></li>
                </ul>
            </nav>
        </div>
    </header>

  <main class="container my-4">
    
    <div class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
      <strong>Berhasil!</strong> Data anggota baru telah berhasil didaftarkan ke dalam sistem.
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    
    <div class="card shadow-sm">
      <div class="card-body">
        <h4 class="card-title mb-4 text-primary">Form Tambah Anggota</h4>
        
        <form>
          <div class="mb-3">
            <label for="nama" class="form-label fw-semibold">Nama</label>
            <input type="text" class="form-control" id="nama" name="nama" required />
          </div>
          
          <div class="mb-3">
            <label for="no_anggota" class="form-label fw-semibold">No. Anggota</label>
            <input type="text" class="form-control" id="no_anggota" name="no_anggota" required />
          </div>
          
          <div class="mb-3">
            <label for="alamat" class="form-label fw-semibold">Alamat</label>
            <input type="text" class="form-control" id="alamat" name="alamat" />
          </div>
          
          <div class="mb-3">
            <label for="no_hp" class="form-label fw-semibold">No. HP</label>
            <input type="text" class="form-control" id="no_hp" name="no_hp" />
          </div>
          
          <div class="mb-3">
            <label for="tanggal_bergabung" class="form-label fw-semibold">Tanggal Bergabung</label>
            <input type="date" class="form-control" id="tanggal_bergabung" name="tanggal_bergabung" min="1990-01-01" max="2026-12-31" />
          </div>
          
          <div class="mb-3">
            <label for="email" class="form-label fw-semibold">Email</label>
            <input type="email" class="form-control" id="email" name="email" />
          </div>
          
          <button type="submit" class="btn btn-primary text-white">Simpan Data</button>
        </form>
        
      </div>
    </div>
  </main>
  
  <footer class="container mt-5 text-center">
    <p>&copy; 2026 SIMPUS-Mini &mdash; Jobsheet 2.</p>
  </footer>
  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
