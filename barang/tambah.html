<!doctype html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIGUDANG-Mini | Tambah Barang</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="../assets/css/style.css" />
</head>

<body class="bg-light">
    <header class="navbar navbar-expand-lg bg-primary sticky-top shadow-sm" data-bs-theme="dark">
        <div class="container">
            <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="../index.html">
                <i class="bi bi-boxes fs-4"></i> SIGUDANG-Mini
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu"
                aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto fw-medium">
                    <li class="nav-item"><a class="nav-link" href="../index.html">Beranda</a></li>
                    <li class="nav-item"><a class="nav-link" href="list.html">Daftar Barang</a></li>
                    <li class="nav-item"><a class="nav-link active" href="tambah.html">Tambah Barang</a></li>
                    <li class="nav-item"><a class="nav-link" href="../supplier/list.html">Daftar Supplier</a></li>
                    <li class="nav-item"><a class="nav-link" href="../supplier/tambah.html">Tambah Supplier</a></li>
                </ul>
            </div>
        </div>
    </header>

    <main class="container py-5">

        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
            <h2 class="fw-bold mb-0 text-dark">
                <i class="bi bi-box-seam text-primary me-2"></i> Tambah Barang Baru
            </h2>
            <a href="list.html" class="btn btn-outline-secondary shadow-sm px-4 bg-white">
                <i class="bi bi-arrow-left me-1"></i> Kembali ke Daftar
            </a>
        </div>

        <div class="alert alert-success alert-dismissible fade show shadow-sm border-0 d-flex align-items-center" role="alert">
            <i class="bi bi-check-circle-fill fs-4 me-3"></i>
            <div>
                <strong>Berhasil!</strong> Data barang baru telah berhasil ditambahkan ke dalam sistem.
            </div>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="card border-0 shadow-sm rounded-4">
            <div class="card-body p-4 p-md-5">

                <h5 class="card-title text-primary fw-bold mb-4">Informasi Barang</h5>

                <form id="form-tambah">
                    <div class="row g-4">
                        <div class="col-md-6">
                            <label for="nama_barang" class="form-label fw-semibold text-secondary">Nama Barang</label>
                            <input type="text" class="form-control" name="nama_barang" id="nama_barang" placeholder="Masukkan nama barang..." required />
                        </div>

                        <div class="col-md-6">
                            <label for="merek" class="form-label fw-semibold text-secondary">Merek</label>
                            <input type="text" class="form-control" name="merek" id="merek" placeholder="Masukkan merek barang..." required />
                        </div>

                        <div class="col-md-6 col-lg-3">
                            <label for="tahun_masuk" class="form-label fw-semibold text-secondary">Tahun Masuk</label>
                            <input type="number" class="form-control" name="tahun_masuk" id="tahun_masuk" min="1990" max="2026" placeholder="Contoh: 2026" required />
                        </div>

                        <div class="col-md-6 col-lg-3">
                            <label for="kode_barang" class="form-label fw-semibold text-secondary">Kode Barang</label>
                            <input type="text" class="form-control" name="kode_barang" id="kode_barang" placeholder="Contoh: BRG-001" required />
                        </div>

                        <div class="col-md-6 col-lg-3">
                            <label for="stok" class="form-label fw-semibold text-secondary">Jumlah Stok</label>
                            <input type="number" class="form-control" name="stok" id="stok" min="0" placeholder="0" required />
                        </div>

                        <div class="col-md-6 col-lg-3">
                            <label for="kategori" class="form-label fw-semibold text-secondary">Kategori</label>
                            <select class="form-select" id="kategori" name="kategori" required>
                                <option value="" disabled selected>Pilih kategori...</option>
                                <option value="elektronik">Elektronik</option>
                                <option value="atk">Alat Tulis Kantor</option>
                                <option value="bahan-baku">Bahan Baku</option>
                                <option value="perlengkapan">Perlengkapan</option>
                            </select>
                        </div>
                    </div>

                    <hr class="my-4 text-muted">

                    <div class="d-flex justify-content-end gap-2">
                        <button type="reset" class="btn btn-light px-4 border">Reset</button>
                        <button type="submit" class="btn btn-primary px-4">
                            <i class="bi bi-floppy me-1"></i> Simpan Data
                        </button>
                    </div>
                </form>

            </div>
        </div>
    </main>

    <footer class="mt-auto py-4 text-center text-secondary border-top bg-white">
        <div class="container">
            <p class="mb-0">&copy; 2026 <strong>SIGUDANG-Mini</strong> &mdash; Jobsheet 6.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/barang.js"></script>
</body>

</html>
