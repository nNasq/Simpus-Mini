<!doctype html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIMPUS-Mini | Daftar Buku</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../assets/css/style.css" />
</head>

<body class="bg-light">
    <header class="navbar navbar-expand-lg bg-primary sticky-top shadow-sm" data-bs-theme="dark">
        <div class="container">
            <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="../index.html">
                <i class="bi bi-book-half fs-4"></i> SIMPUS-Mini
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu"
                aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto fw-medium">
                    <li class="nav-item"><a class="nav-link" href="../index.html">Beranda</a></li>
                    <li class="nav-item"><a class="nav-link active" href="list.html">Daftar Buku</a></li>
                    <li class="nav-item"><a class="nav-link" href="tambah.html">Tambah Buku</a></li>
                    <li class="nav-item"><a class="nav-link" href="../anggota/list.html">Daftar Anggota</a></li>
                    <li class="nav-item"><a class="nav-link" href="../anggota/tambah.html">Tambah Anggota</a></li>
                </ul>
            </div>
        </div>
    </header>

    <main class="container py-5">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
            <h2 class="fw-bold mb-0 text-dark">
                <i class="bi bi-journals text-primary me-2"></i> Daftar Buku
            </h2>
            <div class="d-flex gap-2">
                <button type="button" id="btn-muat-ulang" class="btn btn-outline-secondary shadow-sm px-4">
                    <i class="bi bi-arrow-clockwise me-1"></i> Muat Ulang
                </button>
                <a href="tambah.html" class="btn btn-primary shadow-sm px-4">
                    <i class="bi bi-plus-lg me-1"></i> Tambah Buku Baru
                </a>
            </div>
        </div>
        
        <div class="card border-0 shadow-sm rounded-4">
            <div class="card-body p-4">
                
                <div class="row mb-4">
                    <div class="col-md-6 col-lg-4">
                        <div class="input-group shadow-sm">
                            <span class="input-group-text bg-white border-end-0" id="search-icon">
                                <i class="bi bi-search text-muted"></i>
                            </span>
                            <input type="text" id="search-input" class="form-control border-start-0 ps-0" 
                                placeholder="Ketik judul buku..." aria-describedby="search-icon">
                        </div>
                    </div>
                </div>
                
                <div class="table-responsive">
                    <table class="table table-hover align-middle border text-nowrap mb-0">
                        <thead class="table-primary text-center">
                            <tr>
                                <th class="text-start">Judul</th>
                                <th>Kategori</th>
                                <th>Pengarang</th>
                                <th>Tahun</th>
                                <th>Stok</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody class="text-center">
                            <tr id="loading-row">
                                <td colspan="6" class="text-center py-4">
                                    <div id="loading-indicator" class="text-secondary" style="display:none;">
                                        <div class="spinner-border spinner-border-sm me-2" role="status"></div>
                                        <span>Memuat data...</span>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

            </div>
        </div>
    </main>

    <footer class="mt-auto py-4 text-center text-secondary border-top bg-white">
        <div class="container">
            <p class="mb-0">&copy; 2026 <strong>SIMPUS-Mini</strong> &mdash; Jobsheet 6.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/buku.js"></script>
</body>

</html>
