<!doctype html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIGUDANG-Mini | Tambah Supplier</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body class="bg-light">
    <header class="navbar navbar-expand-lg bg-primary sticky-top shadow-sm" data-bs-theme="dark">
        <div class="container">
            <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="../index.html">
                <i class="bi bi-boxes fs-4"></i> SIGUDANG-Mini
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto fw-medium">
                    <li class="nav-item"><a class="nav-link" href="../index.html">Beranda</a></li>
                    <li class="nav-item"><a class="nav-link" href="../barang/list.html">Daftar Barang</a></li>
                    <li class="nav-item"><a class="nav-link" href="../barang/tambah.html">Tambah Barang</a></li>
                    <li class="nav-item"><a class="nav-link" href="list.html">Daftar Supplier</a></li>
                    <li class="nav-item"><a class="nav-link active" href="tambah.html">Tambah Supplier</a></li>
                </ul>
            </div>
        </div>
    </header>

    <main class="container py-5">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
            <h2 class="fw-bold mb-0 text-dark">
                <i class="bi bi-truck text-primary me-2"></i> Tambah Supplier Baru
            </h2>
            <a href="list.html" class="btn btn-outline-secondary shadow-sm px-4 bg-white">
                <i class="bi bi-arrow-left me-1"></i> Kembali ke Daftar
            </a>
        </div>

        <div class="alert alert-success alert-dismissible fade show shadow-sm border-0 d-flex align-items-center" role="alert">
            <i class="bi bi-check-circle-fill fs-4 me-3"></i>
            <div>
                <strong>Berhasil!</strong> Data supplier baru telah berhasil didaftarkan ke dalam sistem.
            </div>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="card border-0 shadow-sm rounded-4">
            <div class="card-body p-4 p-md-5">
                <h5 class="card-title text-primary fw-bold mb-4">Informasi Supplier</h5>

                <form id="form-tambah">
                    <div class="row g-4">
                        <div class="col-md-6">
                            <label for="nama" class="form-label fw-semibold text-secondary">Nama Supplier</label>
                            <input type="text" class="form-control" id="nama" name="nama" placeholder="Masukkan nama supplier..." required />
                        </div>

                        <div class="col-md-6">
                            <label for="kode_supplier" class="form-label fw-semibold text-secondary">Kode Supplier</label>
                            <input type="text" class="form-control" id="kode_supplier" name="kode_supplier" placeholder="Contoh: SUP001" required />
                        </div>

                        <div class="col-md-6">
                            <label for="email" class="form-label fw-semibold text-secondary">Email</label>
                            <input type="email" class="form-control" id="email" name="email" placeholder="nama@email.com" />
                        </div>

                        <div class="col-md-6">
                            <label for="no_hp" class="form-label fw-semibold text-secondary">Nomor HP</label>
                            <input type="text" class="form-control" id="no_hp" name="no_hp" placeholder="08xxxxxxxxxx" />
                        </div>

                        <div class="col-md-8">
                            <label for="alamat" class="form-label fw-semibold text-secondary">Alamat</label>
                            <input type="text" class="form-control" id="alamat" name="alamat" placeholder="Masukkan alamat lengkap..." />
                        </div>

                        <div class="col-md-4">
                            <label for="tanggal_kerjasama" class="form-label fw-semibold text-secondary">Tanggal Kerjasama</label>
                            <input type="date" class="form-control" id="tanggal_kerjasama" name="tanggal_kerjasama" min="1990-01-01" max="2026-12-31" />
                        </div>
                    </div>

                    <hr class="my-4 text-muted">

                    <div class="d-flex justify-content-end gap-2">
                        <button type="reset" class="btn btn-light px-4 border">Reset</button>
                        <button type="submit" class="btn btn-primary px-4">
                            <i class="bi bi-floppy me-1"></i> Simpan Data
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <footer class="mt-auto py-4 text-center text-secondary border-top bg-white">
        <div class="container">
            <p class="mb-0">&copy; 2026 <strong>SIGUDANG-Mini</strong> &mdash; Jobsheet 6.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/supplier.js"></script>
</body>
</html>
